version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: x402-postgres
    environment:
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402_dev_password
      POSTGRES_DB: x402_payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x402"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
